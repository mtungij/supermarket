# Local backing services for development.
# The Laravel app itself is stateless and configured entirely through
# environment variables, so it can run on the host (php artisan serve) or
# in any PHP 8.3+ container pointed at these services.
#
#   docker compose up -d
#   then set DB_PORT=33084 (and REDIS_* if you enable Redis) in .env
#
# Credentials below are LOCAL DEVELOPMENT placeholders only.

services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:33084:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${DB_DATABASE:-supermarket_saas}
      MYSQL_USER: ${DB_USERNAME:-supermarket}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP

volumes:
  mysql-data:
